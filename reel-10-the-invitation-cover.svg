<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1400" viewBox="0 0 900 1400">
  <defs>
    <style>
      .cream { fill: #fff7e8; }
      .paper { fill: #fffdf7; }
      .teal { fill: #12a8d4; }
      .deep { fill: #00546a; }
      .green { fill: #006a49; }
      .ink { fill: #103d43; }
      .muted { fill: #687b73; }
      .navy { fill: #092f80; }
      .headline { font: 900 80px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .headline2 { font: 900 76px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .sub { font: 800 33px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .tag { font: 900 25px Arial, Helvetica, sans-serif; letter-spacing: 1.4px; }
      .name { font: 900 32px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .role { font: 700 20px Arial, Helvetica, sans-serif; letter-spacing: 0; }
    </style>
    <linearGradient id="room" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef6f5"/>
      <stop offset=".45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e1ede7"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="900" height="1400"/>
    </clipPath>
  </defs>

  <rect width="900" height="1400" class="cream"/>
  <g clip-path="url(#frame)">
    <rect width="900" height="1400" fill="url(#room)"/>
    <rect x="0" y="0" width="250" height="1400" fill="#ffffff" opacity=".42"/>
    <rect x="250" y="0" width="2" height="1400" fill="#dbe7e4"/>
    <circle cx="450" cy="142" r="33" fill="#fff8df"/>

    <path d="M628 320 C738 354, 817 460, 828 614 C686 586, 609 480, 628 320Z" fill="#789b84" opacity=".72"/>
    <path d="M680 344 C719 446, 744 528, 748 676" stroke="#103d43" stroke-width="8" opacity=".22" fill="none"/>
    <path d="M610 454 C716 481, 798 564, 830 704 C690 704, 614 602, 610 454Z" fill="#4e8068" opacity=".38"/>

    <rect x="50" y="70" width="256" height="58" rx="29" class="green"/>
    <text x="178" y="110" text-anchor="middle" class="tag paper">ADHD PARENTING</text>

    <rect x="48" y="166" width="804" height="356" rx="24" class="paper" opacity=".96"/>
    <text x="88" y="262" class="headline ink">The problem</text>
    <text x="88" y="354" class="headline ink">isn't</text>
    <rect x="308" y="282" width="266" height="90" rx="14" class="teal"/>
    <text x="337" y="350" class="headline2 paper">you.</text>
    <rect x="88" y="408" width="660" height="54" rx="27" class="cream"/>
    <text x="118" y="445" class="sub deep">Your system doesn't fit ADHD.</text>

    <circle cx="452" cy="724" r="176" fill="#f4cdb7"/>
    <path d="M280 695 C291 478, 709 480, 720 698 L762 1400 L216 1400 Z" fill="#f1d181"/>
    <rect x="220" y="906" width="560" height="494" rx="62" class="navy"/>
    <circle cx="370" cy="700" r="14" class="ink"/>
    <circle cx="522" cy="700" r="14" class="ink"/>
    <path d="M379 790 C423 826, 487 826, 532 790" stroke="#103d43" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="452" cy="910" r="19" fill="#111111"/>
    <rect x="443" y="927" width="18" height="125" rx="9" fill="#111111"/>

    <rect x="50" y="1190" width="500" height="92" rx="14" fill="#ffffff" opacity=".9"/>
    <text x="82" y="1239" class="name ink">SHARON COLLON</text>
    <text x="82" y="1270" class="role muted">PCC ADHD Coach and Parenting Expert</text>

    <circle cx="780" cy="1238" r="48" class="green"/>
    <path d="M760 1238 L779 1257 L807 1218" stroke="#fff7e8" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
