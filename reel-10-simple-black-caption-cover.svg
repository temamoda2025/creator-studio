<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1400" viewBox="0 0 900 1400">
  <defs>
    <style>
      .ink { fill: #061014; }
      .white { fill: #ffffff; }
      .teal { fill: #13a7d2; }
      .cream { fill: #f7efe0; }
      .navy { fill: #0b2f7f; }
      .skin { fill: #f2c9b4; }
      .hair { fill: #efd184; }
      .headline { font: 900 72px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .headlineSmall { font: 900 60px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .sub { font: 800 34px Arial, Helvetica, sans-serif; letter-spacing: 0; }
    </style>
    <linearGradient id="room" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#edf4f4"/>
      <stop offset=".55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ddebe6"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="900" height="1400"/>
    </clipPath>
  </defs>

  <rect width="900" height="1400" fill="url(#room)"/>
  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="245" height="1400" fill="#ffffff" opacity=".35"/>
    <path d="M620 330 C740 370, 826 482, 842 650 C698 616, 610 502, 620 330Z" fill="#6f967b" opacity=".72"/>
    <path d="M675 350 C718 460, 742 548, 752 706" stroke="#0b2f2e" stroke-width="8" opacity=".2" fill="none"/>

    <circle cx="450" cy="730" r="178" class="skin"/>
    <path d="M280 700 C292 478, 708 478, 720 700 L760 1400 L215 1400 Z" class="hair"/>
    <rect x="222" y="900" width="556" height="500" rx="60" class="navy"/>
    <circle cx="368" cy="700" r="14" fill="#102f36"/>
    <circle cx="522" cy="700" r="14" fill="#102f36"/>
    <path d="M380 790 C425 824, 486 824, 532 790" stroke="#102f36" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="452" cy="908" r="19" fill="#111111"/>
    <rect x="443" y="925" width="18" height="132" rx="9" fill="#111111"/>

    <rect x="58" y="100" width="784" height="318" rx="18" class="ink"/>
    <text x="94" y="191" class="headline white">The problem</text>
    <text x="94" y="282" class="headline white">isn't</text>
    <rect x="338" y="220" width="204" height="88" rx="12" class="teal"/>
    <text x="370" y="286" class="headline white">you.</text>
    <text x="94" y="366" class="sub cream">The system doesn't fit ADHD.</text>
  </g>
</svg>
